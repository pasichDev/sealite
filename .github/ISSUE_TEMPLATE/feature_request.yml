name: Feature request
description: Suggest an addition or change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not do today, and why does it matter?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The API or behaviour you would like. Mention security implications if keys are involved.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: platform
    attributes:
      label: Platforms affected
      multiple: true
      options:
        - Android
        - iOS
        - macOS native
        - JVM on macOS
        - JVM on Windows
        - JVM on Linux
