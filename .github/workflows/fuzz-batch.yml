name: fuzz-batch

# ClusterFuzzLite, batch mode: a longer weekly run of the same harness on main, for the inputs a
# five-minute pull-request run does not reach. The corpus is not stored between runs (that needs a
# separate repository and a token); every run starts from the seed corpus in fuzz/corpus.

on:
  schedule:
    - cron: '17 3 * * 3'
  workflow_dispatch:

permissions: {}

concurrency:
  group: fuzz-batch
  cancel-in-progress: false

jobs:
  fuzz:
    name: fuzz (${{ matrix.sanitizer }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the fuzzers (${{ matrix.sanitizer }})
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: c
          sanitizer: ${{ matrix.sanitizer }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run the fuzzers (${{ matrix.sanitizer }})
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 3000
          mode: batch
          sanitizer: ${{ matrix.sanitizer }}
          report-unreproducible-crashes: false
          output-sarif: false
