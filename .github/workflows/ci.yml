name: ci

# The pipeline for pull requests and for main. This file only wires the reusable workflows together:
#   _natives.yml  builds every native library once and checks them
#   _test.yml     runs every test suite on its platform against exactly those libraries
# `ci-ok` is the one check branch protection requires.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

# A new push cancels the older run of the same pull request. Runs on main are never cancelled: a
# release is cut from a commit that must have been tested in full.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No forbidden wording in tracked files
        run: |
          # The pattern is assembled from pieces so this file does not match itself.
          re="$(printf '%s|%s|%s|%s' 'clau''de' 'anthro''pic' 'co-authored''-by' 'generated'' with')"
          hits="$(git grep -I -i -l -E "$re" -- . ':(exclude).github/workflows/ci.yml' || true)"
          if [ -n "$hits" ]; then
            echo "Forbidden wording in:"; echo "$hits"; exit 1
          fi
      - name: Private directories are not tracked
        run: |
          tracked="$(git ls-files -- notes reference "$(printf '%s%s' 'CLAU' 'DE.md')")"
          if [ -n "$tracked" ]; then
            echo "Tracked private paths:"; echo "$tracked"; exit 1
          fi
      - name: Every source file carries an SPDX identifier (or the upstream notice of a ported file)
        run: |
          missing="$(git ls-files -z -- 'sealite/src/*.kt' 'build-logic/src/*.kt' 'build-logic/*.kts' \
            'sealite/*.kts' 'build.gradle.kts' 'settings.gradle.kts' 'sealite/src/native/*.c' 'sealite/src/native/*.h' \
            | xargs -0 grep -L -E 'SPDX-License-Identifier|Android Open Source Project' || true)"
          if [ -n "$missing" ]; then
            echo "Missing '// SPDX-License-Identifier: Apache-2.0' in:"; echo "$missing"; exit 1
          fi

  # Formatting and static analysis need no native library, so they start at once and report in minutes.
  # detekt only resolves the JVM resources directory: an empty prebuilt layout is enough for that.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Install clang-format (the version Spotless pins)
        run: pipx install clang-format==22.1.8
      - name: Spotless (ktlint for Kotlin and Gradle scripts, clang-format for the C glue)
        run: ./gradlew spotlessCheck -Psealite.requireClangFormat --stacktrace
      - name: detekt
        run: |
          mkdir -p "${RUNNER_TEMP}/no-natives/jvm/natives"
          ./gradlew :sealite:detekt -Psealite.prebuiltNatives="${RUNNER_TEMP}/no-natives" --stacktrace

  natives:
    permissions:
      contents: read
    uses: ./.github/workflows/_natives.yml
    with:
      caches: true

  test:
    needs: natives
    permissions:
      contents: read
    uses: ./.github/workflows/_test.yml
    with:
      # The JDK 25 row runs on main only.
      full: ${{ github.event_name == 'push' }}
      caches: true

  # The single required check. It fails unless every job it needs succeeded, so a renamed matrix
  # row can never silently drop out of branch protection.
  ci-ok:
    if: always()
    needs: [hygiene, lint, natives, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Every needed job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq 'map_values(.result)'
          echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success")' > /dev/null
