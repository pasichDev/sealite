name: release-please

# Keeps a release PR open on main (version bump in gradle.properties + CHANGELOG.md, computed from
# Conventional Commits). Merging it creates the tag, and the tag push starts release.yml.
#
# It runs with a token of its own (RELEASE_PLEASE_TOKEN, a fine-grained personal access token with
# contents, pull requests and workflows write on this repository). Events caused by the default
# GITHUB_TOKEN do not start other workflows, so with that token the CI would not run on the release PR
# and the tag would not start the release. There is deliberately no fallback to GITHUB_TOKEN: a
# release that silently skips its checks is worse than a release workflow that stops and says why.

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: The release token is configured
        env:
          TOKEN_PRESENT: ${{ secrets.RELEASE_PLEASE_TOKEN != '' }}
        run: |
          if [ "${TOKEN_PRESENT}" != "true" ]; then
            echo "::error title=RELEASE_PLEASE_TOKEN is missing::Add the repository secret RELEASE_PLEASE_TOKEN (a fine-grained personal access token for this repository with Contents, Pull requests and Workflows write). Without it the release PR gets no CI and the tag does not start release.yml."
            exit 1
          fi
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
