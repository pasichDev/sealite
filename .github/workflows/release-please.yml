name: release-please

# Keeps a release PR open on main (version bump in gradle.properties + CHANGELOG.md, computed from
# Conventional Commits). Merging it creates the tag and the GitHub release, and this workflow then
# calls release.yml to build and publish.
#
# release.yml is called instead of waiting for its tag trigger on purpose: events caused by the
# default GITHUB_TOKEN (the tag release-please pushes) do not start other workflows. A personal access
# token or GitHub App token for release-please would also work, but needs a secret to be rotated.
#
# For the same reason ci.yml and pr-title.yml do not run on the release PR that release-please opens
# with the default token: do not make them required checks for that PR, or give release-please a
# token of its own (`token:` input).

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
