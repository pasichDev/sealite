name: natives

# Reusable: builds every native library on macOS arm64, runs the macOS-hosted tests and uploads the
# JVM resources + Android jniLibs for the downstream jobs.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  natives:
    name: natives (macOS arm64)
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install the Android NDK
        run: sdkmanager --install "ndk;${NDK_VERSION}" && echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Cache Kotlin/Native toolchains and downloaded sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.konan
            build/native-downloads
            sealite/build/native-downloads
          key: native-downloads-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'build-logic/src/**') }}
          restore-keys: native-downloads-${{ runner.os }}-

      # Windows/Linux sysroots: the cross tasks depend on :internal:konan-sysroots:downloadKonanSysroots,
      # which makes Kotlin/Native fetch them into ~/.konan (cached above). llvm-nm / llvm-objdump come
      # from the NDK installed above.
      - name: Build all native libraries (macOS x64 and arm64, Windows, Linux, Android)
        run: ./gradlew :sealite:buildAllCrossNatives :sealite:packageJvmNatives :sealite:packageAndroidJniLibs --stacktrace

      - name: Tests (jvm, macosArm64, iosSimulatorArm64)
        run: ./gradlew :sealite:allTests --stacktrace

      - name: Check (includes the Kotlin ABI check)
        run: ./gradlew check :sealite:checkLegacyAbi --stacktrace

      - name: Collect the natives in the layout the other jobs read
        run: ./gradlew :sealite:collectNativesForCi --stacktrace

      - name: Upload natives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: natives
          # Layout contract with -Psealite.prebuiltNatives=<dir> (see sealite.native):
          #   <dir>/jvm/natives/<os>_<arch>/*   osx_arm64, osx_x64, windows_x64, linux_x64, linux_arm64
          #   <dir>/android/jniLibs/<abi>/*     arm64-v8a, armeabi-v7a, x86_64, x86
          path: sealite/build/natives-out
          if-no-files-found: error
          retention-days: 14
