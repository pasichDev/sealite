name: natives

# Reusable. Builds every native library once, on one macOS arm64 runner (Kotlin/Native's clang and
# sysroots for Windows and Linux, the NDK for Android, Xcode for Apple), checks them statically and
# uploads one artifact. Every test job downloads that artifact and runs against it with
# -Psealite.prebuiltNatives, so what is tested is what is shipped.
#
# Layout of the artifact (see sealite.native.gradle.kts):
#   jvm/natives/<os>_<arch>/     osx_arm64, osx_x64, windows_x64, linux_x64, linux_arm64 (+ .sha256)
#   android/jniLibs/<abi>/       arm64-v8a, armeabi-v7a, x86_64, x86
#   apple/<target>/libsealite.a  ios_arm64, ios_simulator_arm64, macos_arm64_static
#   apple/include/               sqlite3.h and sealite_rename.h, the headers those libraries were built with

on:
  workflow_call:
    inputs:
      caches:
        description: Use and write the Gradle and Kotlin/Native caches. Off for releases.
        type: boolean
        default: true
      retention-days:
        description: How long the artifact is kept.
        type: number
        default: 7

permissions: {}

jobs:
  natives:
    name: natives (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install the Android NDK
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      # The OpenSSL release signature is checked only when gpg is on the PATH.
      - name: gpg for the OpenSSL signature check
        run: command -v gpg > /dev/null || brew install gnupg

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: ${{ !inputs.caches }}
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Kotlin/Native's LLVM and sysroots (about 2.5 GB) change with the Kotlin version only; the
      # downloaded sources are pinned by sha256 and change with the native build files. Only main
      # writes them, so a pull request can not poison the cache the release-adjacent runs read.
      - name: Restore Kotlin/Native toolchains
        if: inputs.caches
        id: konan
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.konan/dependencies
            ~/.konan/kotlin-native-prebuilt-*
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Restore the downloaded native sources
        if: inputs.caches
        id: sources
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/native-downloads
          key: native-sources-${{ hashFiles('build-logic/src/main/kotlin/sealite.native.gradle.kts', 'build-logic/src/main/kotlin/io/github/pasichdev/sealite/build/SealiteCrossPlugin.kt') }}

      - name: Build every native library
        run: ./gradlew :sealite:buildAllCrossNatives :sealite:collectNativesForCi --stacktrace

      - name: Static checks (checksums, glibc ceiling, 16 KiB alignment, macOS minimum OS)
        env:
          LLVM_BIN: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/darwin-x86_64/bin
        run: .github/scripts/verify-natives.sh sealite/build/natives-out

      - name: Record the toolchain and the checksums
        run: |
          {
            echo '### Toolchain'
            echo
            echo '```'
            xcodebuild -version
            echo "NDK ${NDK_VERSION}"
            java -version 2>&1 | head -n 1
            echo '```'
            echo
            echo '### SHA-256 of the native libraries'
            echo
            echo '```'
            (cd sealite/build/natives-out && find . -type f ! -name '*.sha256' | LC_ALL=C sort | xargs shasum -a 256)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save Kotlin/Native toolchains
        if: inputs.caches && github.ref == 'refs/heads/main' && steps.konan.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.konan/dependencies
            ~/.konan/kotlin-native-prebuilt-*
          key: ${{ steps.konan.outputs.cache-primary-key }}

      - name: Save the downloaded native sources
        if: inputs.caches && github.ref == 'refs/heads/main' && steps.sources.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/native-downloads
          key: ${{ steps.sources.outputs.cache-primary-key }}

      - name: Upload the natives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: natives
          path: sealite/build/natives-out
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
