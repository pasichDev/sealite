name: release

# Runs for a tag pushed by hand, and is called by release-please.yml when a release PR is merged:
# a tag created with the default GITHUB_TOKEN does not trigger `push` workflows, so the call is how
# release-please releases reach this pipeline.
on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: The release tag (vX.Y.Z), already created by release-please.
        required: true
        type: string
    secrets:
      ORG_GRADLE_PROJECT_mavenCentralUsername:
        required: true
      ORG_GRADLE_PROJECT_mavenCentralPassword:
        required: true
      ORG_GRADLE_PROJECT_signingInMemoryKey:
        required: true
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword:
        required: true

permissions:
  contents: read

env:
  PREBUILT: ${{ github.workspace }}/prebuilt-natives
  # The tag being released: the input when called, the pushed tag otherwise.
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  natives:
    uses: ./.github/workflows/natives.yml

  publish:
    needs: natives
    runs-on: macos-latest # Apple klibs can only be published from macOS
    environment: release  # required reviewers gate the publish
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: Tag must match the version and sit on main
        run: |
          version="${TAG#v}"
          declared="$(sed -n 's/^version=//p' gradle.properties)"
          [ "$version" = "$declared" ] || { echo "tag $version != gradle.properties $declared"; exit 1; }
          git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main || { echo "tag is not on main"; exit 1; }
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: natives
          path: ${{ env.PREBUILT }}
      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.ORG_GRADLE_PROJECT_mavenCentralUsername }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.ORG_GRADLE_PROJECT_mavenCentralPassword }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKey }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKeyPassword }}
        run: ./gradlew publishToMavenCentral -Psealite.prebuiltNatives="${PREBUILT}" --no-configuration-cache --stacktrace

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: natives
          path: ${{ env.PREBUILT }}
      - name: Changelog section and native checksums
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "[" v "]") || index($0, " " v)) { found=1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || { echo "no CHANGELOG.md section for $version"; exit 1; }
          # The hand-written overview of the release, if there is one, goes above the generated entry.
          : > highlights.md
          if [ -f ".github/release-notes/${version}.md" ]; then
            { cat ".github/release-notes/${version}.md"; echo; } > highlights.md
          fi
          {
            echo
            echo '### SHA-256 of the native libraries'
            echo '```'
            (cd "${PREBUILT}" && find . -type f \( -name '*.so' -o -name '*.dll' -o -name '*.dylib' \) -print0 | sort -z | xargs -0 sha256sum)
            echo '```'
          } >> release-notes.md
      - name: Create the GitHub release, or add the checksums to the one release-please created
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            { cat highlights.md; gh release view "$TAG" --json body --jq .body; sed -n '/^### SHA-256 of the native libraries/,$p' release-notes.md; } > combined-notes.md
            gh release edit "$TAG" --notes-file combined-notes.md
          else
            cat highlights.md release-notes.md > combined-notes.md
            gh release create "$TAG" --title "$TAG" --notes-file combined-notes.md --verify-tag
          fi
