name: codeql

# C analysis of the JNI glue (sealite/src/native). SQLCipher and OpenSSL are downloaded into build/ and
# never sit in the source tree, so there is no vendored code to exclude; the config limits the scan to
# the glue anyway.
#
# Kotlin is not analysed: CodeQL supports Kotlin up to 2.4.20 and this project is on 2.4.21. When the
# supported range reaches the project's version, add `java-kotlin` with `build-mode: manual` and a
# step that runs `./gradlew :sealite:compileKotlinJvm` against a prebuilt-natives directory.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'sealite/src/native/**'
      - '.github/codeql/**'
      - '.github/workflows/codeql.yml'
  schedule:
    - cron: '23 4 * * 1'

permissions: {}

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (c-cpp)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: c-cpp
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:c-cpp
